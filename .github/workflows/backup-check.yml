name: Test de restauration

# Chaque dimanche : copie le schéma public de production dans une base jetable et compare les tables (scripts/verify-backup.sh).
# Prérequis : secret SUPABASE_DB_URL (Supabase → Project Settings → Database → Connection string, « Session pooler », rôle en lecture).
# Un échec envoie un e-mail GitHub : la sauvegarde ne se restaure pas, à regarder avant d'en avoir besoin.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      scratch:
        image: postgres:17
        env: { POSTGRES_PASSWORD: scratch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Outils Postgres 17 (même version que Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
      - name: Sauvegarder, restaurer, comparer
        env:
          SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCRATCH_URL: postgresql://postgres:scratch@localhost:5432/postgres
        run: scripts/verify-backup.sh
