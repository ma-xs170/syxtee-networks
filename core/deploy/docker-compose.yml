# /opt/syxtee/docker-compose.yml : SYXTEE Core + Caddy (HTTPS), à côté du compose du srtla-receiver.
# Réseau « host » : le Core joint le SLS sur 127.0.0.1 (ports déjà publiés par le srtla-receiver),
# et n'écoute lui-même que sur 127.0.0.1:8787. Seul Caddy (80/443) est exposé.
services:
  core:
    build:
      context: ./core
      dockerfile: ${CORE_DOCKERFILE:-Dockerfile}
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      SLS_API_URL: http://127.0.0.1:8080
      SLS_SRT_HOST: 127.0.0.1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # SYXTEE Guard : suit le journal du relais (API Docker) et coupe / bannit sur ordre du Core, avec iptables
  # dans le réseau du conteneur srtla-receiver. Root, mais aucun port public (API sur 127.0.0.1:8788, jeton).
  guard:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: syxtee-guard
    command: ["node", "dist/guard.js"]
    user: root
    network_mode: host
    pid: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_PTRACE]
    security_opt: ["apparmor=unconfined"]
    environment:
      CORE_API_TOKEN: ${CORE_API_TOKEN}
      GUARD_PORT: "8788"
      PORT: "8787"
      GUARD_SLS_CONTAINER: srtla-receiver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # SYXTEE Cam : réception WebRTC (WHIP). Instance séparée du mediamtx existant (RTMP/HLS/SRT désactivés).
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    network_mode: host
    volumes:
      - ./core/deploy/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # TURN (coturn) : secours de l'aperçu du Contrôle à distance quand le navigateur (4G, réseau d'entreprise) ne joint pas MediaMTX en UDP.
  # Ouvrir 3478/udp+tcp et 49160-49200/udp (UFW). Puis dans .env : TURN_USER, TURN_PASSWORD, TURN_HOST et
  # WEBRTC_ICE_SERVERS='[{"urls":["turn:<TURN_HOST>:3478?transport=udp","turn:<TURN_HOST>:3478?transport=tcp"],"username":"<TURN_USER>","credential":"<TURN_PASSWORD>"}]'
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    env_file: .env
    command: ["-n", "--lt-cred-mech", "--realm=syxtee-networks.fr", "--fingerprint", "--no-multicast-peers", "--no-cli", "--min-port=49160", "--max-port=49200", "--user=${TURN_USER}:${TURN_PASSWORD}", "--external-ip=${TURN_EXTERNAL_IP}"]
    profiles: ["turn"]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # SYXTEE Bot : bot Discord (nouveautés, /services, alertes). HTTP sur 127.0.0.1:8790 (webhook GitHub, /announce).
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    network_mode: host
    env_file: .env
    environment:
      CORE_URL: http://127.0.0.1:8787
      BOT_HOST: 127.0.0.1
      BOT_PORT: "8790"
      DATA_DIR: /app/data
    volumes:
      - ./data/bot:/app/data
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  # SYXTEE Web : le site Next.js (image standalone). Écoute sur 127.0.0.1:3100, Caddy le publie sur SITE_DOMAIN.
  # Variables serveur dans .env.web ; les 2 NEXT_PUBLIC_SUPABASE_* (publiques) sont lues dans .env au build.
  web:
    build:
      context: ./repo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    network_mode: host
    env_file: .env.web
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3100"
    restart: unless-stopped
    mem_limit: 3g
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  caddy:
    image: caddy:2
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

volumes:
  caddy_data:
  caddy_config:
