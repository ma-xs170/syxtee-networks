# MediaMTX SYXTEE : reçoit le WebRTC (WHIP) de SYXTEE Cam et le RTMP des caméras (DJI, GoPro, OBS…).
# Instance séparée du mediamtx existant : HLS et SRT désactivés. RTMP sur 1935 : ce port doit être libre
# (vérifier avec `sudo ss -ltnp | grep 1935` avant de déployer).
# Le Core valide chaque publication (authMethod http) et relaie le flux vers le relais SRT.
logLevel: info

authMethod: http
authHTTPAddress: http://127.0.0.1:8787/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: 127.0.0.1:9997

# RTSP en local seulement : le Core y lit le flux pour le relayer.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
# RTMP : rtmp://<hôte>:1935/live/<clé de diffusion> (relais RTMP créés dans le dashboard).
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"
hls: false
srt: false
playback: false
metrics: false
pprof: false

webrtc: true
# Handshake WHIP : derrière Caddy (HTTPS), en local seulement.
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: ["127.0.0.1"]
# Média WebRTC : port 8189 en UDP (et TCP en secours pour les réseaux qui bloquent l'UDP).
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

paths:
  all_others:
    # Un seul éditeur par clé : un 2e appareil est refusé (au lieu de remplacer celui en direct).
    overridePublisher: false
