<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SYXTEE Encodeur</title>
<style>
/* Tokens repris du site (globals.css) : noir doux, texte clair, une seule couleur d'action, --live réservé à EN LIVE. */
:root {
  --background: #070708; --foreground: #fafafa; --muted: #8f949d; --surface: #0d0d10; --input: #131316;
  --line: rgba(255,255,255,.085); --line-strong: rgba(255,255,255,.17);
  --fill: #fafafa; --fill-hover: #e4e4e7; --on-accent: #0a0a0a;
  --ok: #3dd68c; --warn: #f5a524; --bad: #f2555a; --live: #ff3b30;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  --background: #fbfbfc; --foreground: #0a0a0a; --muted: #5c5c61; --surface: #f4f4f5; --input: #f4f4f5;
  --line: rgba(10,10,10,.12); --line-strong: rgba(10,10,10,.25);
  --fill: #0a0a0a; --fill-hover: #2b2b2e; --on-accent: #fbfbfc;
  --ok: #16a34a; --warn: #b45309; --bad: #dc2626; --live: #d92b20;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --background: #fbfbfc; --foreground: #0a0a0a; --muted: #5c5c61; --surface: #f4f4f5; --input: #f4f4f5;
    --line: rgba(10,10,10,.12); --line-strong: rgba(10,10,10,.25);
    --fill: #0a0a0a; --fill-hover: #2b2b2e; --on-accent: #fbfbfc;
    --ok: #16a34a; --warn: #b45309; --bad: #dc2626; --live: #d92b20;
  }
}
* { box-sizing: border-box; }
html { background: var(--background); }
body { margin: 0; min-height: 100dvh; background: var(--background); color: var(--foreground); font: 15px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header { display: flex; align-items: center; justify-content: space-between; height: 64px; }
header strong { font-size: 15px; letter-spacing: .01em; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
/* Téléphone : Direct, Connexions, Réglages, Journal. Ordinateur : deux colonnes. */
.col { display: contents; }
#s-direct { order: 1; } #s-links { order: 2; } #s-set { order: 3; } #s-log { order: 4; }
.grid > .col > .card { margin-top: 0; }
@media (min-width: 900px) {
  .grid { grid-template-columns: 5fr 7fr; align-items: start; }
  .col { display: block; }
  .grid > .col > .card + .card { margin-top: 16px; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; }
h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.02em; margin: 0; font-weight: 600; }
h2 { font-size: 17px; margin: 0 0 16px; font-weight: 600; letter-spacing: -.01em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 9999px; padding: 4px 12px; font: 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.badge[hidden] { display: none; }
.badge.live { border-color: var(--live); color: var(--live); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.btn { appearance: none; border: 1px solid var(--line-strong); background: transparent; color: var(--foreground); border-radius: 9999px; padding: 10px 20px; font: 600 14px var(--font-sans); cursor: pointer; white-space: nowrap; transition: transform .15s, background .15s; }
.btn:hover { background: var(--input); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--fill); color: var(--on-accent); border-color: var(--fill); }
.btn.primary:hover { background: var(--fill-hover); }
.btn.big { width: 100%; padding: 16px 24px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
.stats b { display: block; font: 600 20px var(--font-mono); }
.stats span { font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-size: 14px; min-height: 21px; margin: 12px 0 0; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.link { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--input); }
.link.off { opacity: .6; }
.link small { display: block; color: var(--muted); font: 12px var(--font-mono); }
.tag { font-size: 12px; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
form { display: grid; gap: 16px; }
label { display: grid; gap: 8px; font-size: 14px; }
input, select { width: 100%; background: var(--input); color: var(--foreground); border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; font: 15px var(--font-sans); }
input.mono { font-family: var(--font-mono); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font: 13px var(--font-mono); max-height: 220px; overflow: auto; }
.log li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.log .warn { color: var(--warn); } .log .bad { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; }
.log li.empty { display: block; }
dialog { background: var(--surface); color: var(--foreground); border: 1px solid var(--line-strong); border-radius: 24px; padding: 24px; width: min(92vw, 360px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <strong>SYXTEE Encodeur</strong>
    <button class="btn" id="theme" type="button" aria-label="Changer le thème">Auto</button>
  </header>

  <main class="grid">
    <div class="col">
      <section class="card" id="s-direct" aria-labelledby="direct">
        <div class="row">
          <h1 id="direct">Hors ligne</h1>
          <span class="badge" id="badge" hidden></span>
        </div>
        <p class="muted" id="sub" style="margin:8px 0 24px">Le direct n'est pas lancé.</p>
        <button class="btn primary big" id="go" type="button">Démarrer le direct</button>
        <p class="err" id="err" role="alert"></p>
        <div class="stats">
          <div><b id="t-rate">0</b><span>kb/s émis</span></div>
          <div><b id="t-links">0/0</b><span>liens actifs</span></div>
          <div><b id="t-time">00:00</b><span>durée</span></div>
        </div>
      </section>

      <section class="card" id="s-log" aria-labelledby="j">
        <h2 id="j">Journal</h2>
        <ul class="log" id="log"></ul>
      </section>
    </div>

    <div class="col">
      <section class="card" id="s-links" aria-labelledby="c">
        <h2 id="c">Connexions</h2>
        <ul class="links" id="links"></ul>
        <p class="note" id="bondnote"></p>
      </section>

      <section class="card" id="s-set" aria-labelledby="r">
        <h2 id="r">Réglages</h2>
        <form id="form">
          <label>Destination
            <input id="f-url" class="mono" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="srtla://serveur:5000?streamid=…">
            <span class="hint">Adresse d'envoi de ton relais SYXTEE. Avec srtla://, toutes les connexions sont combinées.</span>
          </label>
          <div class="two">
            <label>Résolution
              <select id="f-res"></select>
            </label>
            <label>Débit (kb/s)
              <input id="f-br" class="mono" type="number" min="500" max="15000" step="100">
            </label>
          </div>
          <label>Latence (ms)
            <input id="f-lat" class="mono" type="number" min="100" max="8000" step="100">
            <span class="hint">Plus la latence est haute, plus le flux résiste aux coupures. 1000 ms convient à la plupart des cas.</span>
          </label>
          <div class="row">
            <span class="hint" id="saved"></span>
            <button class="btn primary" type="submit">Enregistrer</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>

<dialog id="pin">
  <form method="dialog" id="pinform">
    <h2>Code PIN</h2>
    <label>PIN du boîtier
      <input id="pin-in" type="password" autocomplete="current-password" required>
    </label>
    <p class="err" id="pin-err"></p>
    <button class="btn primary big" type="submit">Entrer</button>
  </form>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const safe = (fn) => { try { return fn(); } catch { return null; } };
let pin = safe(() => sessionStorage.getItem("pin")) || "";
let snap = null, dirty = false, busy = false;

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "content-type": "application/json", "x-pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { askPin(); throw new Error("PIN requis."); }
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || "Erreur.");
  return j;
}

function askPin() { const d = $("pin"); if (!d.open) d.showModal(); }
$("pinform").addEventListener("submit", () => { pin = $("pin-in").value; safe(() => sessionStorage.setItem("pin", pin)); refresh(); });

const fmt = (s) => { const m = Math.floor(s / 60), h = Math.floor(m / 60); return (h ? String(h).padStart(2, "0") + ":" : "") + String(m % 60).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const KIND = { wifi: "Wi-Fi", eth: "Ethernet", cell: "4G ou 5G", usb: "Clé 4G USB", other: "Autre" };

function render(s) {
  snap = s;
  const live = s.state === "live", starting = s.state === "starting", err = s.state === "error";
  $("direct").textContent = live ? "En direct" : starting ? "Connexion" : err ? "Reconnexion" : "Hors ligne";
  const b = $("badge");
  b.hidden = !live;
  b.className = "badge" + (live ? " live" : "");
  b.innerHTML = live ? '<span class="dot"></span>EN LIVE' : "";
  $("sub").textContent = live ? "Le flux part vers ton relais." : starting || err ? "Nouvelle tentative en cours." : s.settings.hasUrl ? "Prêt à diffuser." : "Ajoute une destination dans les réglages.";
  const go = $("go");
  go.textContent = s.state === "idle" ? "Démarrer le direct" : "Arrêter le direct";
  go.classList.toggle("primary", s.state === "idle");
  go.disabled = busy || (s.state === "idle" && !s.settings.hasUrl);

  const on = s.links.filter((l) => l.enabled);
  const total = s.links.reduce((a, l) => a + (l.enabled && l.kbps ? l.kbps : 0), 0);
  const measured = on.some((l) => l.kbps !== null);
  $("t-rate").textContent = live ? (measured ? total.toLocaleString("fr-FR") : "n/d") : "0";
  $("t-links").textContent = on.length + "/" + s.links.length;
  $("t-time").textContent = live && s.since ? fmt(Math.max(0, Math.floor((s.now - s.since) / 1000))) : "00:00";

  const ul = $("links");
  ul.replaceChildren();
  if (!s.links.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Aucune connexion détectée. Branche un câble Ethernet, une clé 4G ou active le Wi-Fi."; ul.append(li); }
  for (const l of s.links) {
    const li = document.createElement("li");
    li.className = "link" + (l.enabled ? "" : " off");
    const left = document.createElement("div");
    left.innerHTML = "<strong></strong><small></small>";
    left.firstChild.textContent = KIND[l.kind] || l.name;
    left.lastChild.textContent = l.name + "  " + l.address;
    const rate = document.createElement("span");
    rate.className = "mono tag";
    rate.textContent = !l.enabled ? "désactivé" : l.kbps === null ? "n/d" : l.kbps.toLocaleString("fr-FR") + " kb/s";
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "btn"; btn.textContent = l.enabled ? "Désactiver" : "Activer";
    btn.addEventListener("click", () => act("link", { name: l.name, enabled: !l.enabled }));
    li.append(left, rate, btn);
    ul.append(li);
  }
  $("bondnote").textContent = s.bonding === "srt" ? "SRT direct : une seule connexion est utilisée. Choisis une destination srtla:// pour les combiner." : s.bonding === "srtla" && !s.srtlaAvailable ? "srtla_send est introuvable sur ce boîtier : le bonding est indisponible." : "";

  if (!dirty) {
    $("f-url").value = s.settings.url;
    $("f-br").value = s.settings.bitrateKbps;
    $("f-lat").value = s.settings.latencyMs;
    const sel = $("f-res");
    if (!sel.options.length) for (const r of s.resolutions) sel.add(new Option(r, r));
    sel.value = s.settings.res;
  }

  const log = $("log");
  log.replaceChildren();
  if (!s.events.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "Rien à signaler."; log.append(li); }
  for (const e of s.events.slice().reverse()) {
    const li = document.createElement("li");
    li.className = e.level;
    const t = document.createElement("span"); t.className = "muted"; t.textContent = new Date(e.at).toTimeString().slice(0, 8);
    const x = document.createElement("span"); x.textContent = e.text;
    li.append(t, x); log.append(li);
  }
}

async function act(path, body) {
  busy = true; $("err").textContent = "";
  try { render(await api(path, body || {})); } catch (e) { $("err").textContent = e.message; }
  busy = false;
}

async function refresh() { try { render(await api("state")); $("err").textContent = ""; } catch (e) { if (e.message !== "PIN requis.") $("err").textContent = "Le boîtier ne répond pas."; } }

$("go").addEventListener("click", () => act(snap && snap.state === "idle" ? "start" : "stop"));
for (const id of ["f-url", "f-br", "f-lat", "f-res"]) $(id).addEventListener("input", () => { dirty = true; $("saved").textContent = ""; });
$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  busy = true;
  try {
    render(await api("settings", { url: $("f-url").value, res: $("f-res").value, bitrateKbps: Number($("f-br").value), latencyMs: Number($("f-lat").value) }));
    dirty = false; $("saved").textContent = "Enregistré."; $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
  busy = false;
});

// Thème : Auto / Sombre / Clair, comme sur le site.
const modes = ["auto", "dark", "light"], names = { auto: "Auto", dark: "Sombre", light: "Clair" };
let mode = safe(() => localStorage.getItem("theme")) || "auto";
const applyMode = () => { if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = mode; $("theme").textContent = names[mode]; };
$("theme").addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; safe(() => localStorage.setItem("theme", mode)); applyMode(); });
applyMode();

refresh();
setInterval(() => { if (!busy && !document.hidden) refresh(); }, 1000);
</script>
</body>
</html>
