# Configuration Auth du projet Supabase SYXTEE, appliquée avec `supabase config push`.
# Seuls les réglages déclarés ici sont envoyés ; tout le reste du projet reste inchangé.
# Clés OAuth (Twitch, Discord, Google) et SMTP Resend : dans le tableau de bord (voir supabase/README.md),
# jamais dans ce fichier.
project_id = "syxtee-networks"

[auth]
# Domaine de production (à remplacer par le domaine final).
site_url = "https://syxtee-networks.vercel.app"
# Connexion par email + mot de passe : 10 caractères minimum (jauge et vérification des fuites côté site).
minimum_password_length = 10
# Retours autorisés après un lien reçu par email ou la liaison Twitch : production, previews Vercel, dev, tests e2e.
additional_redirect_urls = [
  "https://syxtee-networks.vercel.app/auth/**",
  "https://*-dj-syxtee.vercel.app/auth/**",
  "http://localhost:3000/auth/**",
  "http://localhost:3100/auth/**",
]
# Bouton « Lier mon Twitch » (Profil). Twitch ne sert plus à se connecter.
enable_manual_linking = true

[auth.email]
enable_signup = true
# Le compte n'est actif qu'après le clic sur le lien de vérification.
enable_confirmations = true
# Changement d'email : lien envoyé à l'ancienne ET à la nouvelle adresse.
double_confirm_changes = true
# Liens valables 24 h (vérification de l'adresse). « Mot de passe oublié » : 1 h, imposé par le site (recovery.ts).
otp_expiry = 86400
# Un envoi toutes les 60 s au plus (aligné sur le bouton « Renvoyer l'email (60 s) »).
max_frequency = "60s"

# Email de connexion aux couleurs SYXTEE (nouveaux comptes et comptes existants).
# ⚠️ Supabase refuse les modèles personnalisés tant que le SMTP par défaut est utilisé (offre gratuite) :
# décommenter après avoir branché Resend (SMTP), puis relancer `supabase config push`.
# [auth.email.template.magic_link]
# subject = "Connexion à SYXTEE"
# content_path = "./supabase/templates/magic-link.html"

# [auth.email.template.confirmation]
# subject = "Connexion à SYXTEE"
# content_path = "./supabase/templates/magic-link.html"
