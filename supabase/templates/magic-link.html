<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Connexion à SYXTEE</title>
  </head>
  <body style="margin:0;padding:0;background:#000000;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
            <tr>
              <td align="center">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center" width="48" height="48" style="width:48px;height:48px;background:#0a0a0a;border:1px solid #262626;border-radius:14px;">
                      <img src="{{ .SiteURL }}/logo-400.png" width="18" height="25" alt="SYXTEE" style="display:block;border:0;" />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:32px;color:#f5f5f5;font-size:26px;font-weight:600;letter-spacing:-0.02em;">
                Connexion à SYXTEE
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:12px;color:#a3a3a3;font-size:15px;line-height:24px;">
                Clique sur le bouton pour te connecter avec {{ .Email }}.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:32px;">
                <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#ffffff;color:#000000;font-size:15px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:12px;">
                  Me connecter
                </a>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:24px;color:#737373;font-size:13px;line-height:20px;">
                Ce lien est valable 10 minutes et ne sert qu'une fois.<br />
                Tu n'as rien demandé ? Ignore cet email, personne ne peut se connecter sans lui.
              </td>
            </tr>
            <tr>
              <td style="padding-top:40px;"><div style="height:1px;background:#1f1f1f;line-height:1px;font-size:1px;">&nbsp;</div></td>
            </tr>
            <tr>
              <td align="center" style="padding-top:20px;color:#525252;font-size:11px;letter-spacing:0.18em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
                SYXTEE NETWORKS
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
